name: Publish New Release To NPM

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build And Pack Release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Release Tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_VERSION" == v* ]]; then
            echo "Release tag must be a plain semver version without a v prefix: $RELEASE_VERSION" >&2
            exit 1
          fi

          release_commit=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$release_commit" "origin/${DEFAULT_BRANCH}"; then
            echo "Release tag must point to a commit in the ${DEFAULT_BRANCH} history." >&2
            exit 1
          fi

      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Registry Signatures
        run: npm audit signatures

      - name: Audit Dependencies
        run: npm audit --package-lock-only --audit-level=high

      - name: Set Package Version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts

      - name: Run Tests
        run: npm test

      - name: Create npm Tarball
        run: |
          mkdir publish-artifact
          npm pack --ignore-scripts --pack-destination publish-artifact
          mv publish-artifact/*.tgz publish-artifact/tardis-dev.tgz

      - name: Upload Package Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: publish-artifact/tardis-dev.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish Package To NPM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Use Node.js v26.7.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org/

      - name: Download Package Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: publish-artifact

      - name: Publish Package
        run: npm publish ./publish-artifact/tardis-dev.tgz --ignore-scripts
